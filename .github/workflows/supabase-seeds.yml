name: Execute Supabase Seeds

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/seeds/**.sql'
      - 'supabase/seed/**.sql'

jobs:
  execute-seeds:
    runs-on: ubuntu-latest
    name: Execute new SQL seeds in Supabase

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed seed files
        id: changed-files
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'supabase/seeds/*.sql' 'supabase/seed/*.sql' | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed seed files: $CHANGED"

      - name: Execute seed files via Supabase Management API
        if: steps.changed-files.outputs.files != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_REF: kwjgfljzdgpfyqknakmy
          SEED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error, sys

          files = os.environ.get('SEED_FILES', '').split()
          project_ref = os.environ['PROJECT_REF']
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          url = f"https://api.supabase.com/v1/projects/{project_ref}/database/query"

          for file in files:
              file = file.strip()
              if not file or not os.path.isfile(file):
                  continue
              print(f"Executing: {file}")
              with open(file, 'r', encoding='utf-8') as f:
                  sql = f.read()
              data = json.dumps({"query": sql}).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json'
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f"Done: {file} (HTTP {resp.status})")
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8')
                  print(f"Error HTTP {e.code}: {body}")
                  sys.exit(1)
          PYEOF

      - name: No seed files changed
        if: steps.changed-files.outputs.files == ''
        run: echo "No seed files changed — nothing to execute."
