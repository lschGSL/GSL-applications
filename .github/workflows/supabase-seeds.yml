name: Execute Supabase Seeds

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/seeds/**.sql'
      - 'supabase/seed/**.sql'

jobs:
  execute-seeds:
    runs-on: ubuntu-latest
    name: Execute new SQL seeds in Supabase

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed seed files
        id: changed-files
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'supabase/seeds/*.sql' 'supabase/seed/*.sql' | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed seed files: $CHANGED"

      - name: Execute seed files via Supabase Management API
        if: steps.changed-files.outputs.files != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_REF: kwjgfljzdgpfyqknakmy
        run: |
          for file in ${{ steps.changed-files.outputs.files }}; do
            if [ -f "$file" ]; then
              echo "Executing: $file"
              SQL=$(cat "$file")
              RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"query\": $(echo "$SQL" | jq -Rs .)}")
              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | head -1)
              echo "HTTP $HTTP_CODE: $BODY"
              if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
                echo "Error executing $file"
                exit 1
              fi
              echo "Done: $file"
            fi
          done

      - name: No seed files changed
        if: steps.changed-files.outputs.files == ''
        run: echo "No seed files changed — nothing to execute."
